
# ============================================================
# POBS ROS 2 / GAZEBO BRIDGE CONFIGURATION
# ============================================================

# ------------------------------------------------------------
# SENSORS: GAZEBO -> ROS 2
# ------------------------------------------------------------

# IMU
- ros_topic_name: "/pobs/imu"
  gz_topic_name: "/pobs/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# Sonar
- ros_topic_name: "/pobs/sonar"
  gz_topic_name: "/pobs/sonar"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Robot pose
- ros_topic_name: "/model/pobs/pose"
  gz_topic_name: "/model/pobs/pose"
  ros_type_name: "geometry_msgs/msg/PoseStamped"
  gz_type_name: "gz.msgs.Pose"
  direction: GZ_TO_ROS


# ------------------------------------------------------------
# SIMULATION CLOCK: GAZEBO -> ROS 2
# ------------------------------------------------------------

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS


# ------------------------------------------------------------
# VELOCITY COMMANDS: ROS 2 -> GAZEBO
# ------------------------------------------------------------

- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ


